<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv='cache-control' content='no-cache'> 
        <meta http-equiv='expires' content='0'> 
        <meta http-equiv='pragma' content='no-cache'>
        <meta name="viewport" content = "width=device-width",initial-scale=0.4>
        <title>
            NYJC NIGHT STUDY QR ADMIN PANEL
        </title>
		<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='nanyang.png') }}">
        <link href='https://fonts.googleapis.com/css?fam  ily=Pacifico' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <style>
            .input {
                color: white;
                text-align: center;
            }
            #form1{
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            #form2{
                max-width: 240px;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            #button{
                max-width: 100px;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            /* .error {
                color: white;
                margin-left: auto;
                margin-right: auto;
                max-width: 300px;
            } */
            h2 {
                font-size: 40px;
            }
            h3 {
                font-size: 20px;
            }
            .video {
                margin: 0 auto;
                width: 720px;
                display: block
            }
        </style>
    </head>
    <body>
        
        <div class = input>

            <h2>NYJC NIGHT STUDY QR ADMIN PANEL</h2>
            <label><h3>Scan a QR Code</h3></label>
            <video id='video' class="video" autoplay>

        </div>
        <div class = error>
            {% if error is not none %}
            <h3>{{ error }}</h3>
            {% endif %}
        </div>
        <script async src="{{ url_for('static', filename='camera.js') }}" type="text/javascript"></script>
    </body>
</html>
