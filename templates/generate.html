<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv='cache-control' content='no-cache'> 
        <meta http-equiv='expires' content='0'> 
        <meta http-equiv='pragma' content='no-cache'> 
        <title>
            NYJC NIGHT STUDY QR GENERATOR
        </title>
	<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='nanyang.png') }}">
        <link href='https://fonts.googleapis.com/css?fam  ily=Pacifico' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <style>
            .input {
                color: white;
                text-align: center;
            }
            #form1{
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            #form2{
                max-width: 240px;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            #button{
                max-width: 100px;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            /* .error {
                color: white;
                margin-left: auto;
                margin-right: auto;
                max-width: 300px;
            } */
            h2 {
                font-size: 40px;
                text-align: center;
            }
            h3 {
                font-size: 20px;
            }
        </style>
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>
    </head>
    <body>
        <h2>NYJC NIGHT STUDY QR GENERATOR</h2>
        <div class = error>
            {% if error is not none %}
            <h3>{{ error }}</h3>
            {% endif %}
        </div>
        <div class = input>
            <label><h3>Generate your QR code here to collect your food later on!</h3></label>

            <form id='form1' action='/display' method='GET'>
		<div class="g-recaptcha" data-sitekey="6LeKpS4aAAAAABrXNs2o5Adx9YGG8RCicK4_sgva"></div>
                <button id='button' type="submit" class="btn btn-primary btn-block btn-large">Generate</button>
            </form>

        </div>
        <h3>This site is created by Bryan Seah from 2011.</h3>
    </body>
</html>
