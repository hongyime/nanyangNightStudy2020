<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv='cache-control' content='no-cache'> 
        <meta http-equiv='expires' content='0'> 
        <meta http-equiv='pragma' content='no-cache'> 
        <title>
            NYJC NIGHT STUDY QR ADMIN PANEL
        </title>
		<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='nanyang.png') }}">
        <link href='https://fonts.googleapis.com/css?fam  ily=Pacifico' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
        <link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <style>
            .input {
                color: white;
                text-align: center;
            }
            #form1{
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            #form2{
                max-width: 240px;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            #button{
                max-width: 100px;
                text-align: center;
                margin-left: auto;
                margin-right: auto;
                padding: 13px;
            }
            .error {
                color: white;
                margin-left: auto;
                margin-right: auto;
                max-width: 300px;
            }
            h2 {
                font-size: 40px;
            }
            h3 {
                font-size: 20px;
            }

        </style>
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>
    </head>
    <body>
        
        <div class="input">
            <h2>NYJC NIGHT STUDY QR ADMIN PANEL</h2>
            <form id='form1' action='/login' method="POST">
                <input type="text" name="username" placeholder="Username" required="required" value="{{request.form.username}}"/>
                <input type="password" name="password" placeholder="Password" required="required" value="{{request.form.password}}"/>
		    <form action="?" method="POST">
      			<div class="g-recaptcha" data-sitekey="6LeKpS4aAAAAABrXNs2o5Adx9YGG8RCicK4_sgva"></div>
			<br/>
			<input type="submit" value="Submit">
		    </form>
                <button id="button" type="submit" class="btn btn-primary btn-block btn-large">Login</button>
            </form>
	    
        </div>
        <div class = error>
            {% if error is not none %}
            <h3>{{ error }}</h3>
            {% endif %}
        </div>
    </body>
</html>
